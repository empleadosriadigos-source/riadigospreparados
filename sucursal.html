<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Riadigos · Constitución</title>
<style>
  :root{
    --bg:#F0EDE4;--surface:#FAFAF7;--border:#DDD8CC;--accent:#75A63D;
    --accent2:#68A9CC;--text:#1C2128;--muted:#6B7685;--danger:#C0392B;--radius:8px;
    --shadow:0 2px 8px rgba(0,0,0,0.09);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
  .topbar{background:#2C2C2C;padding:0 20px;display:flex;align-items:center;gap:10px;height:52px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,0.18);}
  .topbar-brand{color:#fff;font-size:15px;font-weight:700;}
  .topbar-brand span{color:var(--accent);}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .user-chip{font-size:12px;color:#ccc;}
  .btn-logout{background:none;border:1px solid #555;color:#ccc;padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;}
  .btn-logout:hover{background:#444;}
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 90px;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px;}
  .panel h2{font-size:15px;font-weight:700;margin-bottom:14px;}
  .field-group{margin-bottom:14px;}
  .field-group label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:5px;}
  .field-group input,.field-group select,.field-group textarea{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);outline:none;font-family:inherit;}
  .field-group textarea{resize:vertical;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media(max-width:560px){.field-row,.field-row-3{grid-template-columns:1fr;}}
  .btn{display:inline-flex;align-items:center;gap:5px;padding:9px 18px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;}
  .btn:hover:not(:disabled){opacity:.85;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .ss-wrap{position:relative;}
  .ss-dropdown{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:60;max-height:200px;overflow-y:auto;}
  .ss-dropdown.open{display:block;}
  .ss-option{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);}
  .ss-option:hover{background:var(--accent2);color:#fff;}
  .ss-empty{padding:8px 12px;font-size:13px;color:var(--muted);}
  .cliente-chip{display:inline-flex;align-items:center;gap:8px;background:#E8F4FB;border:1px solid #C0DFF0;border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600;color:#2C5F73;}
  .cliente-chip button{background:none;border:none;cursor:pointer;color:var(--danger);font-size:14px;}
  .comp-editor{border:1px solid var(--border);border-radius:6px;margin-bottom:8px;}
  .comp-editor-header{display:grid;grid-template-columns:1fr 90px 100px 32px;gap:6px;padding:7px 10px;background:#EDEAE0;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);border-radius:6px 6px 0 0;}
  .comp-row{display:grid;grid-template-columns:1fr 90px 100px 32px;gap:6px;padding:8px 10px;border-top:1px solid var(--border);align-items:center;}
  @media(max-width:560px){.comp-editor-header,.comp-row{grid-template-columns:1fr 60px 70px 26px;}}
  .comp-row input,.comp-row select{padding:5px 8px;font-size:12px;border:1px solid var(--border);border-radius:5px;background:var(--bg);width:100%;}
  .btn-del-comp{background:none;border:none;color:var(--danger);cursor:pointer;font-size:18px;}
  .pedido-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);}
  .pedido-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .pedido-cliente{font-weight:700;font-size:14px;}
  .pedido-fecha{font-size:12px;color:var(--muted);}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
  .badge-espera{background:#FDF3D8;color:#966B0B;}
  .badge-precio{background:#E8F4FB;color:#2C5F73;}
  .badge-prep{background:#E5EEFA;color:#2563EB;}
  .badge-retirar{background:#EAF6E4;color:#3D7A2A;}
  .badge-rechazo{background:#FDECEA;color:var(--danger);}
  .badge-cancel{background:#EFEFEF;color:#666;}
  .pedido-detalle{font-size:13px;color:var(--text);margin:4px 0;}
  .pedido-mensaje{font-size:13px;background:var(--bg);border-radius:6px;padding:8px 10px;margin-top:8px;border-left:3px solid var(--accent2);}
  .pedido-precio{font-size:17px;font-weight:800;color:var(--accent);margin-top:6px;}
  .pedido-acciones{display:flex;gap:8px;margin-top:10px;}
  .empty-msg{color:var(--muted);font-size:13px;padding:10px 0;}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:11px 24px;border-radius:8px;font-size:14px;font-weight:500;color:#fff;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
  #toast.show{opacity:1;}#toast.ok{background:var(--accent);}#toast.err{background:var(--danger);}
  .login-overlay{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 32px rgba(0,0,0,.15);padding:40px 36px;max-width:360px;width:100%;text-align:center;}
  .login-logo{font-size:20px;font-weight:800;margin-bottom:4px;}
  .login-logo span{color:var(--accent);}
  .login-sub{font-size:13px;color:var(--muted);margin-bottom:28px;}
  .btn-google{display:inline-flex;align-items:center;gap:10px;justify-content:center;width:100%;padding:11px 16px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;}
  .btn-google:hover{box-shadow:0 2px 8px rgba(0,0,0,.12);}
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center;padding:16px;}
  .modal-overlay.open{display:flex;}
  .popup{background:var(--surface);border-radius:var(--radius);box-shadow:0 8px 32px rgba(0,0,0,.25);max-width:380px;width:100%;padding:26px 24px;text-align:center;}
  .popup h3{font-size:16px;margin-bottom:10px;}
  .popup .precio-grande{font-size:28px;font-weight:800;color:var(--accent);margin:12px 0;}
  .popup-acciones{display:flex;gap:10px;margin-top:18px;}
  .popup-acciones .btn{flex:1;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="login-logo">Riadigos <span>·</span> Constitución</div>
    <p class="login-sub">Iniciá sesión para continuar</p>
    <button class="btn-google" id="btnGoogleLogin">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
      Entrar con Google
    </button>
  </div>
</div>

<div id="appRoot" style="display:none;">
  <div class="topbar">
    <div class="topbar-brand">Riadigos <span>·</span> Constitución</div>
    <div class="topbar-right">
      <span class="user-chip" id="userNombre"></span>
      <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </div>

  <div class="wrap">

    <div class="panel">
      <h2>Nuevo pedido de preparado</h2>

      <div class="field-group ss-wrap">
        <label>Cliente</label>
        <div id="clienteChipWrap" style="display:none;margin-bottom:8px;"></div>
        <input type="text" id="clienteBuscar" placeholder="Buscar cliente por nombre o teléfono..." oninput="filtrarClientes()" onfocus="filtrarClientes()">
        <div class="ss-dropdown" id="clienteDropdown"></div>
      </div>
      <div class="field-row" id="clienteNuevoRow" style="display:none;">
        <div class="field-group"><label>Nombre del cliente nuevo</label><input type="text" id="clienteNuevoNombre"></div>
        <div class="field-group"><label>Teléfono</label><input type="text" id="clienteNuevoTelefono"></div>
      </div>

      <div class="field-row-3">
        <div class="field-group">
          <label>Forma farmacéutica</label>
          <select id="pForma" onchange="onFormaChange()"><option value="">— Elegir —</option></select>
        </div>
        <div class="field-group">
          <label>Cantidad total</label>
          <input type="number" id="pCantTotal" step="any" min="0">
        </div>
        <div class="field-group">
          <label>Unidad</label>
          <select id="pUnidad"><option value="">—</option></select>
        </div>
      </div>

      <div class="sec-title" style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">Componentes</div>
      <div class="comp-editor">
        <div class="comp-editor-header"><div>Droga</div><div>Cantidad</div><div>Unidad</div><div></div></div>
        <div id="compRows"></div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="agregarCompRow()">+ Agregar componente</button>

      <div class="field-group" style="margin-top:14px;">
        <label>Observaciones para Riadigos</label>
        <textarea id="pObs" rows="2" placeholder="Cualquier aclaración sobre el pedido..."></textarea>
      </div>

      <button class="btn btn-primary" id="btnEnviar" onclick="enviarPedido()">Enviar solicitud a Riadigos</button>
    </div>

    <div class="panel">
      <h2>Mis pedidos</h2>
      <div id="listaPedidos"><p class="empty-msg">Cargando...</p></div>
    </div>

  </div>
</div>

<div id="toast"></div>

<div class="modal-overlay" id="modalPopup">
  <div class="popup">
    <h3>¡Riadigos respondió tu pedido!</h3>
    <p id="popupCliente" style="color:var(--muted);font-size:13px;"></p>
    <div class="precio-grande" id="popupPrecio"></div>
    <p id="popupMensaje" style="font-size:13px;color:var(--muted);"></p>
    <div class="popup-acciones">
      <button class="btn btn-ghost" onclick="cancelarDesdePopup()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmarDesdePopup()">Confirmar</button>
    </div>
  </div>
</div>

<script src="constantes.js"></script>
<script src="supabase-shared.js"></script>
<script>
const SUCURSAL_NOMBRE = 'Constitución';

// ── Auth (mismo patrón que index.html) ─────────────────────────────
function mostrarLogin(){ document.getElementById('loginOverlay').style.display='flex'; document.getElementById('appRoot').style.display='none'; }
let appIniciada = false;
function mostrarApp(session){
  document.getElementById('loginOverlay').style.display='none';
  document.getElementById('appRoot').style.display='';
  const u=session.user;
  document.getElementById('userNombre').textContent = u.user_metadata?.full_name || u.email || '';
  if(!appIniciada){ appIniciada=true; initApp(); }
}
sbAuth.auth.onAuthStateChange((_e,session)=>{
  if(session){ SB_TOKEN=session.access_token; mostrarApp(session); } else { SB_TOKEN=null; appIniciada=false; mostrarLogin(); }
});
document.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('btnGoogleLogin').addEventListener('click', iniciarSesionGoogle);
});

// ── Estado local ─────────────────────────────────────────────────
let clientes = [], drogas = [];
let clienteSeleccionado = null; // {id,nombre} o null si es cliente nuevo
let compIdx = 0;

function mostrarToast(msg,tipo=''){ const t=document.getElementById('toast'); t.textContent=msg; t.className='show '+tipo; setTimeout(()=>t.className='',3500); }
function poblarSelect(id,opts,conBlanco){ const sel=document.getElementById(id); const val=sel.value; sel.innerHTML=''; if(conBlanco) sel.innerHTML='<option value="">— Elegir —</option>'; opts.forEach(o=>{const op=document.createElement('option'); op.value=o; op.textContent=o; sel.appendChild(op);}); if(val) sel.value=val; }

async function initApp(){
  poblarSelect('pForma', FORMAS, true);
  agregarCompRow();
  try{
    [clientes, drogas] = await Promise.all([
      sbGet('clientes?order=nombre.asc&select=id,nombre,telefono'),
      sbGet('drogas?order=nombre.asc', true)
    ]);
  }catch(err){ mostrarToast('Error cargando datos: '+err.message,'err'); }
  cargarMisPedidos();
  suscribirRealtime();
}

// ── Búsqueda de cliente ─────────────────────────────────────────
function filtrarClientes(){
  const q = document.getElementById('clienteBuscar').value.trim().toLowerCase();
  const dd = document.getElementById('clienteDropdown');
  if(!q){ dd.classList.remove('open'); return; }
  const matches = clientes.filter(c => c.nombre.toLowerCase().includes(q) || (c.telefono||'').includes(q)).slice(0,8);
  dd.innerHTML = '';
  matches.forEach(c=>{
    const div = document.createElement('div');
    div.className='ss-option';
    div.textContent = c.nombre + (c.telefono? ' — '+c.telefono : '');
    div.onclick = ()=> seleccionarCliente(c);
    dd.appendChild(div);
  });
  const nuevo = document.createElement('div');
  nuevo.className='ss-option'; nuevo.style.color='var(--accent)'; nuevo.style.fontWeight='600';
  nuevo.textContent = '+ Crear cliente nuevo: "'+document.getElementById('clienteBuscar').value.trim()+'"';
  nuevo.onclick = ()=> crearClienteNuevo(document.getElementById('clienteBuscar').value.trim());
  dd.appendChild(nuevo);
  dd.classList.add('open');
}
function seleccionarCliente(c){
  clienteSeleccionado = c;
  document.getElementById('clienteNuevoRow').style.display='none';
  document.getElementById('clienteBuscar').style.display='none';
  document.getElementById('clienteDropdown').classList.remove('open');
  const wrap = document.getElementById('clienteChipWrap');
  wrap.style.display='block';
  wrap.innerHTML = `<span class="cliente-chip">${c.nombre}${c.telefono?' — '+c.telefono:''} <button onclick="limpiarCliente()">✕</button></span>`;
}
function crearClienteNuevo(nombre){
  clienteSeleccionado = 'nuevo';
  document.getElementById('clienteBuscar').style.display='none';
  document.getElementById('clienteDropdown').classList.remove('open');
  document.getElementById('clienteNuevoRow').style.display='grid';
  document.getElementById('clienteNuevoNombre').value = nombre;
  const wrap = document.getElementById('clienteChipWrap');
  wrap.style.display='block';
  wrap.innerHTML = `<span class="cliente-chip">Cliente nuevo <button onclick="limpiarCliente()">✕</button></span>`;
}
function limpiarCliente(){
  clienteSeleccionado = null;
  document.getElementById('clienteChipWrap').style.display='none';
  document.getElementById('clienteChipWrap').innerHTML='';
  document.getElementById('clienteNuevoRow').style.display='none';
  document.getElementById('clienteBuscar').style.display='';
  document.getElementById('clienteBuscar').value='';
}
document.addEventListener('click', e=>{ if(!e.target.closest('.ss-wrap')) document.getElementById('clienteDropdown').classList.remove('open'); });

// ── Forma farmacéutica → unidad ──────────────────────────────────
function onFormaChange(){
  const forma = document.getElementById('pForma').value;
  const selUnidad = document.getElementById('pUnidad');
  if(FORMA_UNIDAD_BLOQUEADA.includes(forma)){
    poblarSelect('pUnidad',[FORMA_UNIDAD[forma]],false);
    selUnidad.disabled = true;
  } else if(FORMA_UNIDAD_OPCIONES[forma]){
    poblarSelect('pUnidad', FORMA_UNIDAD_OPCIONES[forma], false);
    selUnidad.disabled = false;
  } else {
    poblarSelect('pUnidad', UNIDADES, true);
    selUnidad.disabled = false;
  }
}

// ── Componentes ───────────────────────────────────────────────────
function agregarCompRow(){
  compIdx++;
  const id = 'comp'+compIdx;
  const div = document.createElement('div');
  div.className='comp-row'; div.id=id;
  div.innerHTML = `
    <div class="ss-wrap">
      <input type="text" placeholder="Buscar droga..." oninput="filtrarDrogas('${id}')" data-drogaid="">
      <div class="ss-dropdown" id="${id}-dd"></div>
    </div>
    <input type="number" step="any" min="0" placeholder="Cant.">
    <select>${UNID_COMP.map(u=>`<option value="${u}">${u}</option>`).join('')}</select>
    <button class="btn-del-comp" onclick="document.getElementById('${id}').remove()">✕</button>`;
  document.getElementById('compRows').appendChild(div);
}
function filtrarDrogas(rowId){
  const row = document.getElementById(rowId);
  const input = row.querySelector('input[type=text]');
  const dd = document.getElementById(rowId+'-dd');
  const q = input.value.trim().toLowerCase();
  input.dataset.drogaid = '';
  if(!q){ dd.classList.remove('open'); return; }
  const matches = drogas.filter(d=>d.nombre.toLowerCase().includes(q)).slice(0,8);
  dd.innerHTML = matches.length ? '' : '<div class="ss-empty">Sin resultados</div>';
  matches.forEach(d=>{
    const op = document.createElement('div');
    op.className='ss-option'; op.textContent=d.nombre;
    op.onclick = ()=>{ input.value=d.nombre; input.dataset.drogaid=d.id; dd.classList.remove('open'); };
    dd.appendChild(op);
  });
  dd.classList.add('open');
}

// ── Enviar pedido ────────────────────────────────────────────────
async function enviarPedido(){
  if(!clienteSeleccionado){ mostrarToast('Elegí o creá un cliente','err'); return; }
  const forma = document.getElementById('pForma').value;
  if(!forma){ mostrarToast('Elegí la forma farmacéutica','err'); return; }
  const filas = [...document.querySelectorAll('#compRows .comp-row')];
  const comps = filas.map(f=>{
    const [inputDroga, inputCant] = f.querySelectorAll('input');
    const sel = f.querySelector('select');
    return { drogaId: inputDroga.dataset.drogaid, drogaNombre: inputDroga.value.trim(), cantidad: inputCant.value, unidad: sel.value };
  }).filter(c=>c.drogaNombre);
  if(comps.length===0){ mostrarToast('Agregá al menos un componente','err'); return; }
  if(comps.some(c=>!c.drogaId)){ mostrarToast('Elegí cada droga de la lista (no queda cargada si no la seleccionás del desplegable)','err'); return; }

  const btn = document.getElementById('btnEnviar');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try{
    let clienteId;
    if(clienteSeleccionado === 'nuevo'){
      const nombre = document.getElementById('clienteNuevoNombre').value.trim();
      const telefono = document.getElementById('clienteNuevoTelefono').value.trim();
      if(!nombre) throw new Error('Falta el nombre del cliente nuevo');
      const nuevo = await sbPost('clientes', {nombre, telefono: telefono||null});
      clienteId = nuevo[0].id;
    } else {
      clienteId = clienteSeleccionado.id;
    }

    const prep = await sbPost('preparados', {
      cliente_id: clienteId,
      fecha_recepcion: new Date().toISOString().slice(0,10),
      estado: 'Petición sucursal',
      origen_sucursal: SUCURSAL_NOMBRE,
      forma_farmaceutica: forma,
      cantidad_total: document.getElementById('pCantTotal').value || null,
      unidad: document.getElementById('pUnidad').value || null,
      observaciones: document.getElementById('pObs').value.trim() || null
    });
    const prepId = prep[0].id;

    for(const c of comps){
      await sbPost('componentes', { preparado_id: prepId, droga_id: c.drogaId, cantidad: c.cantidad||null, unidad: c.unidad });
    }

    mostrarToast('Pedido enviado a Riadigos','ok');
    limpiarFormulario();
    cargarMisPedidos();
  }catch(err){
    mostrarToast('Error: '+err.message, 'err');
  }finally{
    btn.disabled=false; btn.textContent='Enviar solicitud a Riadigos';
  }
}
function limpiarFormulario(){
  limpiarCliente();
  document.getElementById('pForma').value='';
  document.getElementById('pCantTotal').value='';
  poblarSelect('pUnidad', UNIDADES, true);
  document.getElementById('pObs').value='';
  document.getElementById('compRows').innerHTML='';
  compIdx=0; agregarCompRow();
}

// ── Mis pedidos ──────────────────────────────────────────────────
const ESTADO_LABEL = {
  'Petición sucursal': {txt:'Esperando respuesta', cls:'badge-espera'},
  'Rechazado sucursal': {txt:'Rechazado', cls:'badge-rechazo'},
  'Esperando confirmación sucursal': {txt:'Precio propuesto', cls:'badge-precio'},
  'Asignar precio': {txt:'En preparación', cls:'badge-prep'},
  'En laboratorio': {txt:'En preparación', cls:'badge-prep'},
  'Para retirar': {txt:'Para retirar', cls:'badge-retirar'},
  'Cancelado sucursal': {txt:'Cancelado', cls:'badge-cancel'}
};

async function cargarMisPedidos(){
  try{
    const preps = await sbGet(`preparados?origen_sucursal=eq.${encodeURIComponent(SUCURSAL_NOMBRE)}&estado=neq.Entregado&order=created_at.desc`);
    renderPedidos(preps);
  }catch(err){
    document.getElementById('listaPedidos').innerHTML = '<p class="empty-msg">Error al cargar: '+err.message+'</p>';
  }
}
function nombreCliente(id){ const c = clientes.find(x=>x.id===id); return c ? c.nombre : '(cliente)'; }

function renderPedidos(preps){
  const cont = document.getElementById('listaPedidos');
  if(preps.length===0){ cont.innerHTML = '<p class="empty-msg">Todavía no enviaste ningún pedido.</p>'; return; }
  cont.innerHTML = '';
  preps.forEach(p=>{
    const info = ESTADO_LABEL[p.estado] || {txt:p.estado, cls:'badge-cancel'};
    const div = document.createElement('div');
    div.className='pedido-card';
    let html = `
      <div class="pedido-top">
        <div>
          <div class="pedido-cliente">${nombreCliente(p.cliente_id)}</div>
          <div class="pedido-fecha">${p.forma_farmaceutica||''} ${p.cantidad_total?('· '+p.cantidad_total+' '+(p.unidad||'')):''}</div>
        </div>
        <span class="badge ${info.cls}">${info.txt}</span>
      </div>`;
    if(p.estado==='Rechazado sucursal' && p.mensaje_sucursal){
      html += `<div class="pedido-mensaje">Motivo: ${p.mensaje_sucursal}</div>`;
    }
    if(p.estado==='Esperando confirmación sucursal'){
      html += `<div class="pedido-precio">$${p.precio_venta ?? '—'}</div>`;
      if(p.mensaje_sucursal) html += `<div class="pedido-mensaje">${p.mensaje_sucursal}</div>`;
      html += `<div class="pedido-acciones">
        <button class="btn btn-ghost btn-sm" onclick="cancelarPedido('${p.id}')">Cancelar</button>
        <button class="btn btn-primary btn-sm" onclick="confirmarPedido('${p.id}','${p.precio_venta!=null}')">Confirmar</button>
      </div>`;
    }
    div.innerHTML = html;
    cont.appendChild(div);
  });
}

async function confirmarPedido(id, tienePrecioStr){
  const tienePrecio = tienePrecioStr === 'true';
  try{
    await sbPatch('preparados', id, { estado: tienePrecio ? 'En laboratorio' : 'Asignar precio' });
    mostrarToast('Pedido confirmado','ok');
    cargarMisPedidos();
  }catch(err){ mostrarToast('Error: '+err.message,'err'); }
}
async function cancelarPedido(id){
  if(!confirm('¿Cancelar este pedido?')) return;
  try{
    await sbPatch('preparados', id, { estado: 'Cancelado sucursal' });
    mostrarToast('Pedido cancelado','ok');
    cargarMisPedidos();
  }catch(err){ mostrarToast('Error: '+err.message,'err'); }
}

// ── Popup en tiempo real ─────────────────────────────────────────
let popupPrepId = null, popupTienePrecio = false;
function suscribirRealtime(){
  sbAuth.channel('preparados-sucursal')
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'preparados'}, payload=>{
      const n = payload.new, o = payload.old;
      if(n.origen_sucursal !== SUCURSAL_NOMBRE) return;
      if(n.estado==='Esperando confirmación sucursal' && o.estado!=='Esperando confirmación sucursal'){
        abrirPopup(n);
      }
      cargarMisPedidos();
    })
    .subscribe();
}
function abrirPopup(p){
  popupPrepId = p.id; popupTienePrecio = p.precio_venta!=null;
  document.getElementById('popupCliente').textContent = nombreCliente(p.cliente_id);
  document.getElementById('popupPrecio').textContent = p.precio_venta!=null ? '$'+p.precio_venta : 'Precio a confirmar después';
  document.getElementById('popupMensaje').textContent = p.mensaje_sucursal || '';
  document.getElementById('modalPopup').classList.add('open');
}
function cerrarPopup(){ document.getElementById('modalPopup').classList.remove('open'); popupPrepId=null; }
async function confirmarDesdePopup(){
  if(!popupPrepId) return;
  await confirmarPedido(popupPrepId, String(popupTienePrecio));
  cerrarPopup();
}
async function cancelarDesdePopup(){
  if(!popupPrepId) return;
  await cancelarPedido(popupPrepId);
  cerrarPopup();
}
</script>
